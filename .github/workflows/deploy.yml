name: Deploy sites

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-brug:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-brug
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build -w sites/brug
        env:
          SESSIONIZE_EVENT_ID: ${{ secrets.SESSIONIZE_EVENT_ID }}
          SESSIONIZE_API_BASE: ${{ secrets.SESSIONIZE_API_BASE }}

      - name: Cross-post meetings to brdnug.org (WordPress)
        run: npm run sync:wordpress -w sites/brug
        continue-on-error: true
        env:
          WORDPRESS_API_BASE: ${{ secrets.WORDPRESS_API_BASE }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_CATEGORY_ID: ${{ secrets.WORDPRESS_CATEGORY_ID }}

      - name: Email brdnug.org post draft
        run: npm run sync:email -w sites/brug
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/brug/dist

  deploy-brug:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-brug
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-other-sites:
    strategy:
      matrix:
        include:
          # preview: true builds against the GitHub Pages project URL instead of the real
          # custom domain — flip to false once that site's DNS cutover is complete (see
          # www.brssug.org below for the pattern to follow).
          - site: brssug
            preview: false
          - site: brdnug
            preview: true
          - site: brain
            preview: true
      fail-fast: false
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ matrix.site }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build -w sites/${{ matrix.site }}
        env:
          SESSIONIZE_EVENT_ID: ${{ secrets.SESSIONIZE_EVENT_ID }}
          SESSIONIZE_API_BASE: ${{ secrets.SESSIONIZE_API_BASE }}
          GITHUB_PAGES_PROJECT_PREVIEW: ${{ matrix.preview }}

      - name: Deploy to BRUserGroups/${{ matrix.site }}-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: BRUserGroups/${{ matrix.site }}-pages
          publish_branch: main
          publish_dir: sites/${{ matrix.site }}/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
